name: Deploy Automático para o Servidor

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Executar comandos no servidor via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # 1. Entrar na pasta correta
            cd /var/www/TudoPassa/TudoPassa
            
            # 2. Ignorar erros de dono da pasta (Dubious Ownership)
            git config --global safe.directory '*'
            
            # 3. Resetar qualquer lixo local e forçar a atualização
            git fetch origin main
            git reset --hard origin/main
            
            # 4. Instalar dependências (caso tenha algo novo)
            npm install
            
            # 5. GERAR O SITE (Sem isso o navegador não mostra o código novo)
            npm run build